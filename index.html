<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burn Creek Speedshop</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#120c09">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rye&family=Chakra+Petch:wght@500;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --rust-primary: #b34b1e;
      --rust-glow: #d9622b;
      --rust-deep: #74290a;
      --cream-bg: #f4e8d3;
      --cream-text: #eedcc0;
      --cream-muted: #aa957c;
      --cast-iron: #13100e;
      --panel-dark: #1c1714;
      --card-bg: #221c18;
      --border-rivet: #3d3129;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #0b0807;
      background-image: 
        radial-gradient(#1f1712 18%, transparent 19%), 
        radial-gradient(#1a130f 18%, transparent 19%);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
      color: var(--cream-text); 
      font-family: 'Chakra Petch', sans-serif;
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }

    #app-container { 
      width: 100%; 
      max-width: 500px; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      background: var(--cast-iron); 
      border-left: 3px double var(--rust-primary);
      border-right: 3px double var(--rust-primary);
      box-shadow: 0 0 40px rgba(0,0,0,0.95);
    }
    
    .checker-divider {
      height: 10px;
      background-image: 
        linear-gradient(45deg, #0e0b0a 25%, transparent 25%), 
        linear-gradient(-45deg, #0e0b0a 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #0e0b0a 75%), 
        linear-gradient(-45deg, transparent 75%, #0e0b0a 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
      background-color: var(--cream-bg);
      width: 100%;
      border-bottom: 2px solid var(--rust-primary);
    }

    header { 
      background: linear-gradient(180deg, #2a1f1a 0%, #17120e 100%); 
      padding: 10px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 2px solid var(--rust-primary);
    }
    
    .brand-title { 
      font-family: 'Alfa Slab One', cursive;
      font-size: 1.15rem; 
      color: var(--cream-text); 
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000, 0 0 8px rgba(179, 75, 30, 0.4);
    }
    .brand-title span { color: var(--rust-glow); }

    .header-logo {
      height: 38px;
      width: 38px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid var(--rust-primary);
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .btn-killswitch {
      background: #2a110c;
      border: 1px solid #77261a;
      color: #ea7a6c;
      padding: 4px 10px;
      font-family: 'Teko', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
    }

    nav { 
      display: flex; 
      background: #17120e; 
      border-bottom: 2px solid var(--border-rivet); 
    }
    nav button { 
      flex: 1; 
      padding: 12px 6px; 
      background: none; 
      border: none; 
      color: var(--cream-muted); 
      font-family: 'Alfa Slab One', cursive;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer; 
      border-bottom: 3px solid transparent; 
      transition: all 0.2s ease;
    }
    nav button.active { 
      color: var(--cream-bg); 
      background: rgba(179, 75, 30, 0.15);
      border-bottom: 3px solid var(--rust-primary); 
      text-shadow: 0 0 8px rgba(217, 98, 43, 0.6);
    }

    .view { display: none; padding: 16px; flex: 1; overflow-y: auto; }
    .view.active { display: block; }

    .auth-box { 
      padding: 24px 18px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      background: var(--panel-dark);
      border: 2px solid var(--border-rivet);
      border-radius: 6px;
      margin-top: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.7);
    }
    .auth-box input { 
      padding: 12px; 
      border-radius: 4px; 
      border: 1px solid #45362c; 
      background: #0d0a08; 
      color: var(--cream-text); 
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.95rem;
    }
    .auth-box input:focus {
      outline: none;
      border-color: var(--rust-glow);
      box-shadow: 0 0 8px rgba(217, 98, 43, 0.4);
    }

    .btn-speed { 
      background: linear-gradient(180deg, var(--rust-glow) 0%, var(--rust-deep) 100%); 
      color: var(--cream-bg); 
      border: 1px solid #5a1e05; 
      padding: 12px; 
      border-radius: 4px; 
      font-family: 'Alfa Slab One', cursive;
      font-size: 1.05rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer; 
      box-shadow: 0 4px 0 #3d1404;
      text-shadow: 1px 1px 2px #000;
    }
    .btn-speed:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d1404;
    }
    .btn-wrench { 
      background: #28201b; 
      border: 1px solid var(--border-rivet);
      color: var(--cream-muted);
      box-shadow: 0 4px 0 #18120e;
    }

    .post-creator { 
      background: linear-gradient(180deg, #221a15 0%, #181310 100%); 
      border: 1px solid var(--border-rivet); 
      border-top: 3px solid var(--rust-primary);
      border-radius: 6px; 
      padding: 14px; 
      margin-bottom: 18px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .post-creator textarea { 
      background: #0d0a09; 
      border: 1px solid #3d3027; 
      border-radius: 4px; 
      color: var(--cream-text); 
      padding: 10px; 
      resize: none; 
      height: 75px; 
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.95rem;
    }

    .post-card { 
      background: var(--card-bg); 
      border: 1px solid #332720; 
      border-left: 5px solid var(--rust-primary); 
      border-radius: 4px; 
      padding: 14px; 
      margin-bottom: 14px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .post-header { 
      display: flex; 
      justify-content: space-between; 
      font-size: 0.8rem; 
      color: var(--cream-muted); 
      margin-bottom: 8px; 
      border-bottom: 1px dashed #3a2c24;
      padding-bottom: 6px;
    }
    .post-author { 
      font-family: 'Alfa Slab One', cursive;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--cream-bg); 
      text-transform: uppercase;
    }
    .post-image { 
      width: 100%; 
      border-radius: 4px; 
      margin-top: 10px; 
      border: 2px solid #332720; 
      max-height: 420px; 
      object-fit: cover; 
    }

    .todo-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: var(--card-bg); 
      border: 1px solid #332720;
      padding: 12px; 
      border-radius: 4px; 
      margin-bottom: 10px; 
      cursor: pointer;
    }
    .todo-item.done { 
      background: #13100e; 
      border-color: #241a15;
    }
    .todo-item.done span { 
      text-decoration: line-through; 
      color: #634f43; 
    }
    .todo-badge {
      font-size: 0.75rem;
      font-family: 'Chakra Petch', sans-serif;
      background: #2b1f18;
      color: var(--rust-glow);
      border: 1px solid #4a3427;
      padding: 2px 7px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div class="checker-divider"></div>

  <!-- INLOGGNING -->
  <div id="auth-view" class="view active">
    <div style="text-align: center; margin: 15px 0 10px 0;">
      <!-- ENBART DEN FÖRSTORADE LOGGAN UTAN EXTRA TEXT -->
      <img src="logo.png" alt="Burn Creek Speedshop" style="max-width: 290px; width: 85%; height: auto; margin: 0 auto; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.95); border: 3px solid var(--rust-primary); display: block;" onerror="this.style.display='none'">
    </div>
    
    <div class="auth-box">
      <input type="text" id="auth-name" placeholder="FÖRARNAMN (VID REGISTRERING)">
      <input type="email" id="auth-email" placeholder="E-POST">
      <input type="password" id="auth-password" placeholder="LÖSENORD (MINST 6 TECKEN)">
      <button class="btn-speed" onclick="login()">PELLE I BOTTEN (LOGGA IN)</button>
      <button class="btn-speed btn-wrench" onclick="register()">NYTT PIT-PASS (SKAPA KONTO)</button>
      <p id="auth-error" style="color: #e57368; font-size: 0.85rem; text-align: center;"></p>
    </div>
  </div>

  <!-- HUVUDVY (INLOGGAD) -->
  <div id="main-view" style="display: none; flex-direction: column; height: 100vh;">
    <header>
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <div>
          <span class="brand-title">SPEED<span>SHOP</span></span>
          <div style="font-size: 0.65rem; color: var(--rust-glow); font-family: 'Rye', cursive; letter-spacing: 1px;">BRÄNNEHYLTE</div>
        </div>
      </div>
      <div>
        <span id="user-display" style="font-size: 0.95rem; color: var(--cream-bg); font-family: 'Alfa Slab One', cursive; letter-spacing: 1px; margin-right: 8px;"></span>
        <button class="btn-killswitch" onclick="logout()">KILL SWITCH</button>
      </div>
    </header>

    <nav>
      <button class="tab-btn active" onclick="switchTab('feed')">DEPÅLOGG</button>
      <button class="tab-btn" onclick="switchTab('todo')">ATT FIXA / KÖPA</button>
    </nav>

    <!-- FLÖDE -->
    <div id="feed-tab" class="view active">
      <div class="post-creator">
        <textarea id="post-text" placeholder="Rapport från lyften, mekstatus eller bytesdelar..."></textarea>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="file" id="post-file" accept="image/*" style="display: none;" onchange="updateFileName()">
          <button class="btn-speed btn-wrench" onclick="document.getElementById('post-file').click()" style="padding: 6px 14px; font-size: 0.9rem;">📷 BILD</button>
          <span id="file-chosen" style="font-size: 0.8rem; color: var(--cream-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;"></span>
          <button class="btn-speed" style="margin-left: auto; padding: 6px 18px; font-size: 0.95rem;" onclick="publishPost()">BRÄNN AV</button>
        </div>
      </div>
      <div id="posts-container">Laddar depåloggen...</div>
    </div>

    <!-- INKÖP / ATT GÖRA -->
    <div id="todo-tab" class="view">
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="todo-input" placeholder="T.ex. kapskivor, 10L E85, bromsrengöring..." style="flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #45362c; background: #0d0a09; color: var(--cream-text); font-family: 'Chakra Petch', sans-serif;">
        <button class="btn-speed" style="padding: 8px 14px; font-size: 0.95rem;" onclick="addTodo()">LÄGG TILL</button>
      </div>
      <div id="todos-container"></div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAyn6xM-pkDVK7ojbQXCjfHO07P8rwevMQ",
    authDomain: "burncreekspeedshop.firebaseapp.com",
    projectId: "burncreekspeedshop",
    storageBucket: "burncreekspeedshop.firebasestorage.app",
    messagingSenderId: "611870239128",
    appId: "1:611870239128:web:5e8973ec49556be0f823ed"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'flex';
      document.getElementById('user-display').innerText = `${(user.displayName || user.email.split('@')[0]).toUpperCase()}`;
      loadFeed();
      loadTodos();
    } else {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('main-view').style.display = 'none';
    }
  });

  async function register() {
    const name = document.getElementById('auth-name').value.trim();
    const email = document.getElementById('auth-email').value.trim();
    const pass = document.getElementById('auth-password').value;
    if (!name) return alert('Ange förarnamn!');
    try {
      const res = await auth.createUserWithEmailAndPassword(email, pass);
      await res.user.updateProfile({ displayName: name });
      location.reload();
    } catch (err) { 
      document.getElementById('auth-error').innerText = err.message; 
    }
  }

  async function login() {
    const email = document.getElementById('auth-email').value.trim();
    const pass = document.getElementById('auth-password').value;
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (err) { 
      document.getElementById('auth-error').innerText = err.message; 
    }
  }

  function logout() { auth.signOut(); }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && tab === 'feed') || (i === 1 && tab === 'todo')));
    document.getElementById('feed-tab').classList.toggle('active', tab === 'feed');
    document.getElementById('todo-tab').classList.toggle('active', tab === 'todo');
  }

  function updateFileName() {
    const f = document.getElementById('post-file').files[0];
    document.getElementById('file-chosen').innerText = f ? f.name : '';
  }

  async function publishPost() {
    const text = document.getElementById('post-text').value.trim();
    const file = document.getElementById('post-file').files[0];
    if (!text && !file) return;

    let imageUrl = '';
    if (file) {
      const ref = storage.ref(`posts/${Date.now()}_${file.name}`);
      const upload = await ref.put(file);
      imageUrl = await upload.ref.getDownloadURL();
    }

    await db.collection('posts').add({
      text: text,
      imageUrl: imageUrl,
      author: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('post-text').value = '';
    document.getElementById('post-file').value = '';
    document.getElementById('file-chosen').innerText = '';
  }

  function loadFeed() {
    db.collection('posts').orderBy('createdAt', 'desc').limit(25).onSnapshot(snapshot => {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      snapshot.forEach(doc => {
        const p = doc.data();
        const date = p.createdAt ? new Date(p.createdAt.toDate()).toLocaleDateString('sv-SE', { hour: '2-digit', minute: '2-digit' }) : 'Nyss';
        container.innerHTML += `
          <div class="post-card">
            <div class="post-header">
              <span class="post-author">${p.author}</span>
              <span>${date}</span>
            </div>
            ${p.text ? `<p style="font-size: 0.95rem; line-height: 1.45;">${p.text}</p>` : ''}
            ${p.imageUrl ? `<img src="${p.imageUrl}" class="post-image" loading="lazy">` : ''}
          </div>
        `;
      });
    });
  }

  async function addTodo() {
    const input = document.getElementById('todo-input');
    const val = input.value.trim();
    if (!val) return;
    await db.collection('todos').add({ text: val, done: false, addedBy: auth.currentUser.displayName || 'Depå' });
    input.value = '';
  }

  function toggleTodo(id, currentStatus) {
    db.collection('todos').doc(id).update({ done: !currentStatus });
  }

  function loadTodos() {
    db.collection('todos').onSnapshot(snapshot => {
      const container = document.getElementById('todos-container');
      container.innerHTML = '';
      snapshot.forEach(doc => {
        const t = doc.data();
        container.innerHTML += `
          <div class="todo-item ${t.done ? 'done' : ''}" onclick="toggleTodo('${doc.id}', ${t.done})">
            <input type="checkbox" ${t.done ? 'checked' : ''} style="cursor: pointer; accent-color: var(--rust-primary);">
            <span style="flex: 1;">${t.text}</span>
            <span class="todo-badge">${t.addedBy}</span>
          </div>
        `;
      });
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
